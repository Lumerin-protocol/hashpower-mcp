name: Bump ABI packages

# Fired by the four @hashpower/*-abi publish workflows (repository_dispatch
# abi-published). Opens a PR on `dev` that moves the committed pins to the
# npm `latest` line. That is what `npx @hashpower/mcp` installs, and every
# `latest` version carries both networks. Hosted MCP does not depend on
# these pins: deploy-mcp.yml resolves `dev` or `latest` at image build.
# Keeping one set of pins means dev → main merges do not conflict.
# Does not push to protected branches.
#
# PAT: HASHPOWER_MCP_DISPATCH_TOKEN (Contents + Pull requests on this repo).
# Can be the same fine-grained PAT as HASHPOWER_IO_DISPATCH_TOKEN if that
# token's repo allow-list includes hashpower-mcp.

on:
  repository_dispatch:
    types: [abi-published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch to bump (dev or main)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - main

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            REF="${{ github.event.client_payload.source_ref }}"
            PKG="${{ github.event.client_payload.package }}"
            VER="${{ github.event.client_payload.version }}"
            echo "📦 abi-published: ${PKG}@${VER} from ${REF}"
          else
            REF="${{ github.event.inputs.source_ref }}"
            PKG="manual"
            VER=""
          fi
          case "$REF" in
            main|dev) ;;
            *) echo "::error::Refusing to bump unexpected branch '$REF'"; exit 1 ;;
          esac
          # Pins are identical on both branches and only ever change on dev.
          # main receives them through the normal dev → main promotion.
          echo "branch=dev" >> "$GITHUB_OUTPUT"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.branch }}
          token: ${{ secrets.HASHPOWER_MCP_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Update ABI packages
        run: |
          # The committed pins follow `latest` on every branch. The `dev`
          # dist-tag has an empty mainnet block, so it is never committed;
          # the dev image picks it up at build time instead.
          TAG=latest
          echo "Installing @hashpower/*-abi@$TAG"
          for pkg in \
            @hashpower/oracle-abi \
            @hashpower/collateral-abi \
            @hashpower/futures-abi \
            @hashpower/perps-abi
          do
            if npm view "$pkg@$TAG" version >/dev/null 2>&1; then
              pnpm add "$pkg@$TAG"
            else
              echo "::warning::$pkg has no '$TAG' dist-tag yet — leaving the current pin"
            fi
          done
          pnpm check && pnpm test

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HASHPOWER_MCP_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump @hashpower/*-abi (${{ steps.ref.outputs.package }}@${{ steps.ref.outputs.version }})"
          branch: chore/abi-bump-${{ steps.ref.outputs.branch }}
          delete-branch: true
          title: "chore: bump ABI packages (${{ steps.ref.outputs.branch }})"
          body: |
            Automatic follow-up after `${{ steps.ref.outputs.package }}@${{ steps.ref.outputs.version }}`.

            Moves the committed `@hashpower/*-abi` pins to the npm `latest` line. Hosted dev and main images resolve their own dist-tag at build time, so this only affects `npx @hashpower/mcp` and local runs.
          labels: dependencies
