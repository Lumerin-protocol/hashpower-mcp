name: Deploy hashpower-mcp

# Builds the Streamable HTTP image and rolls the Fargate service.
#
# Terraform (.bedrock) owns the immutable shell: ECS cluster, public ALB,
# WAF, ACM, Route53. This workflow owns image + task-def env + desired_count.
#
# Branch → environment (same map as hashpower-io):
#   dev  → titanio-dev → HASHPOWER_ENV=testnet → https://mcp.dev.hashpower.io/mcp
#   main → titanio-lmn → HASHPOWER_ENV=mainnet → https://mcp.hashpower.io/mcp
#
# GitHub Environments `dev` / `main`:
#   vars    HASHPOWER_ENV, HASHPOWER_DOCS_URL, MCP_DESIRED_COUNT (default 1)
#   secrets HASHPOWER_RPC_URL (optional — falls back to public Base RPC)
#
# Repo secrets:
#   AWS_ROLE_ARN_DEV / AWS_ROLE_ARN_LMN  from terragrunt output github_actions_role_arn

on:
  push:
    branches:
      - dev
      - main
      - "cicd/**"
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev=DEV, main=LMN)"
        required: true
        type: choice
        options:
          - dev
          - main

permissions:
  id-token: write
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/lumerin-protocol/hashpower-mcp

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      environment: ${{ steps.meta.outputs.environment }}
      env_suffix: ${{ steps.meta.outputs.env_suffix }}
      aws_region: ${{ steps.meta.outputs.aws_region }}
      ecs_cluster: ${{ steps.meta.outputs.ecs_cluster }}
      ecs_service: ${{ steps.meta.outputs.ecs_service }}
      task_family: ${{ steps.meta.outputs.task_family }}
      mcp_url: ${{ steps.meta.outputs.mcp_url }}
      hashpower_env: ${{ steps.meta.outputs.hashpower_env }}
      docs_url: ${{ steps.meta.outputs.docs_url }}
      is_cicd_branch: ${{ steps.meta.outputs.is_cicd_branch }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve environment
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              main) ENV="main" ;;
              cicd/*) ENV="dev"; echo "is_cicd_branch=true" >> "$GITHUB_OUTPUT" ;;
              *) ENV="dev" ;;
            esac
          fi

          VERSION="${{ github.sha }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${VERSION:0:7}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "aws_region=us-east-1" >> "$GITHUB_OUTPUT"
          echo "task_family=tsk-hashpower-mcp" >> "$GITHUB_OUTPUT"

          case "$ENV" in
            dev)
              echo "env_suffix=dev" >> "$GITHUB_OUTPUT"
              echo "ecs_cluster=ecs-hashpower-mcp-dev" >> "$GITHUB_OUTPUT"
              echo "ecs_service=svc-hashpower-mcp-dev" >> "$GITHUB_OUTPUT"
              echo "mcp_url=https://mcp.dev.hashpower.io/mcp" >> "$GITHUB_OUTPUT"
              echo "hashpower_env=testnet" >> "$GITHUB_OUTPUT"
              echo "docs_url=https://dev.hashpower.io" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "env_suffix=lmn" >> "$GITHUB_OUTPUT"
              echo "ecs_cluster=ecs-hashpower-mcp-lmn" >> "$GITHUB_OUTPUT"
              echo "ecs_service=svc-hashpower-mcp-lmn" >> "$GITHUB_OUTPUT"
              echo "mcp_url=https://mcp.hashpower.io/mcp" >> "$GITHUB_OUTPUT"
              echo "hashpower_env=mainnet" >> "$GITHUB_OUTPUT"
              echo "docs_url=https://hashpower.io" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown environment '$ENV'"
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: docker_tags
        run: |
          TAGS="${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
          ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.environment }}-latest"
          if [ "${{ steps.meta.outputs.environment }}" = "main" ]; then
            TAGS="${TAGS}
          ${{ env.GHCR_IMAGE }}:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.meta.outputs.is_cicd_branch != 'true' }}
          load: ${{ steps.meta.outputs.is_cicd_branch == 'true' }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - if: steps.meta.outputs.is_cicd_branch == 'true'
        run: |
          echo "## CI/CD test image (not pushed)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_cicd_branch != 'true'
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ needs.build.outputs.mcp_url }}
    outputs:
      task_def_arn: ${{ steps.deploy.outputs.task_def_arn }}
      skipped: ${{ steps.svc_check.outputs.skip }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.build.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: ${{ needs.build.outputs.aws_region }}
          role-session-name: GitHubActions-HashpowerMcp-${{ github.run_id }}

      - name: Verify service exists
        id: svc_check
        env:
          SERVICE: ${{ needs.build.outputs.ecs_service }}
          CLUSTER: ${{ needs.build.outputs.ecs_cluster }}
          REGION: ${{ needs.build.outputs.aws_region }}
        run: |
          ACTIVE_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$REGION" \
            --query 'services[?status==`ACTIVE`] | length(@)' \
            --output text 2>/dev/null || echo "0")
          if [ "$ACTIVE_COUNT" = "0" ]; then
            echo "⚠️ ECS service '$SERVICE' is not ACTIVE. Apply .bedrock (02-dev or 04-lmn) first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render task definition + deploy
        id: deploy
        if: steps.svc_check.outputs.skip != 'true'
        env:
          CLUSTER: ${{ needs.build.outputs.ecs_cluster }}
          SERVICE: ${{ needs.build.outputs.ecs_service }}
          TASK_FAMILY: ${{ needs.build.outputs.task_family }}
          REGION: ${{ needs.build.outputs.aws_region }}
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ needs.build.outputs.version }}
          HASHPOWER_ENV: ${{ vars.HASHPOWER_ENV || needs.build.outputs.hashpower_env }}
          HASHPOWER_DOCS_URL: ${{ vars.HASHPOWER_DOCS_URL || needs.build.outputs.docs_url }}
          HASHPOWER_RPC_URL: ${{ secrets.HASHPOWER_RPC_URL }}
          MCP_DESIRED_COUNT: ${{ vars.MCP_DESIRED_COUNT || '1' }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --region "${REGION}" \
            --query 'taskDefinition' > task-def.json

          jq --arg IMAGE "${IMAGE}" '
            .containerDefinitions[0].image = $IMAGE |
            del(.containerDefinitions[0].command, .containerDefinitions[0].entryPoint) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > new-task-def.json

          jq -n \
            --arg HASHPOWER_ENV "${HASHPOWER_ENV}" \
            --arg HASHPOWER_DOCS_URL "${HASHPOWER_DOCS_URL}" \
            --arg HASHPOWER_RPC_URL "${HASHPOWER_RPC_URL}" \
            --arg HASHPOWER_TRANSPORT "http" \
            --arg PORT "8080" \
            '[
              {name:"HASHPOWER_ENV", value:$HASHPOWER_ENV},
              {name:"HASHPOWER_DOCS_URL", value:$HASHPOWER_DOCS_URL},
              {name:"HASHPOWER_RPC_URL", value:$HASHPOWER_RPC_URL},
              {name:"HASHPOWER_TRANSPORT", value:$HASHPOWER_TRANSPORT},
              {name:"PORT", value:$PORT}
            ]' > env-block.json

          jq --slurpfile env env-block.json '
            .containerDefinitions[0].environment = $env[0] |
            del(.containerDefinitions[0].secrets, .containerDefinitions[0].command, .containerDefinitions[0].entryPoint)
          ' new-task-def.json > final-task-def.json

          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://final-task-def.json \
            --region "${REGION}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "task_def_arn=${NEW_TASK_DEF}" >> "$GITHUB_OUTPUT"

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${NEW_TASK_DEF}" \
            --desired-count "${MCP_DESIRED_COUNT}" \
            --region "${REGION}" \
            --force-new-deployment > /dev/null

          echo "✅ Deployed ${NEW_TASK_DEF}"

  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.is_cicd_branch != 'true' && needs.deploy.outputs.skipped != 'true'
    steps:
      - name: Wait for /health
        env:
          MCP_URL: ${{ needs.build.outputs.mcp_url }}
        run: |
          set -euo pipefail
          HEALTH="${MCP_URL%/mcp}/health"
          echo "Polling ${HEALTH}"
          for i in $(seq 1 30); do
            if curl -fsS "$HEALTH" | grep -q '"ok":true'; then
              echo "✅ healthy"
              curl -fsS "$HEALTH"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${HEALTH} did not become healthy"
          exit 1

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [build, deploy, verify]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.build.outputs.is_cicd_branch }}" == "true" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.verify.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.verify.result }}" == "cancelled" ] || [ "${{ needs.deploy.result }}" == "cancelled" ] || [ "${{ needs.build.result }}" == "cancelled" ]; then
            echo "status=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.status.outputs.status }}
          environment: ${{ needs.build.outputs.environment }}
          service_name: "hashpower-mcp"
          version: ${{ needs.build.outputs.short_sha || needs.build.outputs.version }}
          image_tag: ${{ format('{0}:{1}', env.GHCR_IMAGE, needs.build.outputs.version) }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_info: ${{ needs.build.outputs.is_cicd_branch == 'true' && '*Mode:* CI/CD Test (image not pushed, no deploy)' || format('*URL:* {0}', needs.build.outputs.mcp_url) }}
